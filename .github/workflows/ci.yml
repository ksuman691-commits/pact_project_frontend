# Runs on every pull request and every push to main. Results show on the PR;
# nothing here blocks merging unless branch protection is turned on in GitHub.
# Vercel still builds the preview for each PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit -p .

  dependencies:
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report-only until the dependency clean-up PR lands (unused firebase, axios,
    # and Next.js 14, whose upgrade is a separate project). Then remove this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: pnpm audit --prod --audit-level high

  sast:
    name: Code scan (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config p/typescript --config p/react --config p/nextjs --config p/secrets --error --metrics=off src

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact --no-banner -v
